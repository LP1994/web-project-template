#https://nginx.org/en/docs/ngx_core_module.html#thread_pool
#########被提示：[emerg] unknown directive "thread_pool"
#thread_pool default threads=32 max_queue=65536;

http {
    #https://nginx.org/en/docs/ngx_core_module.html#include
    include       /etc/nginx/mime.types;
    #https://nginx.org/en/docs/http/ngx_http_core_module.html#default_type
    default_type  application/octet-stream;

    #指定日志格式。
    #参数格式：log_format name [escape=default|json|none] string ...;
    #https://nginx.org/en/docs/http/ngx_http_log_module.html#log_format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    #专门用于HTTP3的日志格式。
    log_format  log_http3_quic  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" "$http3"';

    #https://nginx.org/en/docs/http/ngx_http_log_module.html#access_log
    access_log  /home/lp12278/Documents/Nginx/App/logs/access.log  main;

    #https://nginx.org/en/docs/http/ngx_http_core_module.html#sendfile
    sendfile        on;
    #https://nginx.org/en/docs/http/ngx_http_core_module.html#tcp_nopush
    #tcp_nopush     on;

    #https://nginx.org/en/docs/http/ngx_http_core_module.html#keepalive_timeout
    #keepalive_timeout  0;
    keepalive_timeout  300;

    #使用 SSL/TLS 协议时，压缩响应可能会受到 BREACH 攻击。
    #https://nginx.org/en/docs/http/ngx_http_gzip_module.html
    gzip  on;
    gzip_buffers 16 8k;
    gzip_comp_level 5;
    gzip_http_version 1.1;
    gzip_min_length 20;
    gzip_proxied off;
    gzip_types font/woff font/woff2 font/opentype font/ttf application/xml application/javascript application/atom+xml application/json application/manifest+json application/vnd.google-earth.kml+xml application/wasm application/xhtml+xml text/mathml text/plain text/vnd.wap.wml text/x-component text/css text/xml text/javascript text/cache-manifest;
    gzip_vary on;

    client_body_timeout 3600s;
    client_header_buffer_size 10240k;
    client_header_timeout 3600s;
    #https://nginx.org/en/docs/http/ngx_http_core_module.html#client_max_body_size
    client_max_body_size 0;

