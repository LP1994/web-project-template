    # HTTPS server
    #
    server {
        listen       443 ssl;
		listen       [::]:443 ssl;
        server_name  localhost;

        http2 on;

        #https://nginx.org/en/docs/http/ngx_http_v2_module.html#http2_body_preread_size
        #设置每个请求在开始处理前保存请求正文的缓冲区大小。
        http2_body_preread_size 10240k;
        #设置连接中并发 HTTP/2 流的最大数量。
        http2_max_concurrent_streams 10240;

        #https://nginx.org/en/docs/http/ngx_http_core_module.html#large_client_header_buffers
        large_client_header_buffers 1024 10240k;
		#https://nginx.org/en/docs/http/ngx_http_core_module.html#keepalive_requests
        keepalive_requests 2024;

        access_log  /home/lp12278/Documents/Nginx/App/logs/https.access.log  main;

        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_certificate
        ssl_certificate        /home/lp12278/Documents/Nginx/App/html/HTTPSSL001/002服务端CA证书/HTTPSSL001_Servers_CA.crt;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_certificate_key
        ssl_certificate_key    /home/lp12278/Documents/Nginx/App/html/HTTPSSL001/001根CA证书/HTTPSSL001_Root_CA_Key.key;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_ciphers
        ssl_ciphers ALL:!aNULL:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_protocols
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_prefer_server_ciphers  on;
        #https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_buffer_size
        ssl_buffer_size 16k;

        #此外，使用"="修饰符还可以定义 URI 和位置的精确匹配。如果找到精确匹配，搜索就会终止。例如，如果"/"请求频繁出现，定义 "location = /"将加快这些请求的处理速度，因为第一次比较后搜索就会终止。这样的位置显然不能包含嵌套位置。
        location = / {
            root   /home/lp12278/Documents/Nginx/App/html;
            index  index.html index.htm;
        }

        location /simulation_servers_deno {
            proxy_pass https://localhost:9200;
            proxy_headers_hash_bucket_size 1024;
            proxy_headers_hash_max_size 1024;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #正则表达式用前面的"~*"修饰符（不区分大小写匹配）或"~"修饰符（区分大小写匹配）指定。
        location / {
            root   /home/lp12278/Documents/Nginx/App/html;
            index  index.html index.htm;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /home/lp12278/Documents/Nginx/App/html;
        }
    }

