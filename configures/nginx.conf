    # HTTP3的配置，端口：9003
    # 同时监听 TCP (HTTPS) 和 UDP (QUIC)
    server {
        # HTTP/3 over QUIC
        # reuseport：提升 UDP 性能，避免 worker 竞争端口。
        listen 9003 quic reuseport;
        listen [::]:9003 quic reuseport;

        # HTTPS (HTTP/2)
        listen       9003 ssl;
        listen       [::]:9003 ssl;

        server_name  localhost;



        # Alt-Svc 响应头：用于告知浏览器支持 HTTP/3，ma=2592000 表示缓存 30 天。

        # 兼容“HTTP/3”标准的各个旧版、草案等的写法：
        # add_header Alt-Svc 'h3=":9003"; ma=2592000, h3-29=":9003"; ma=2592000, h3-28=":9003"; ma=2592000, h3-27=":9003"; ma=2592000, h3-25=":9003"; ma=2592000, h3-T050=":9003"; ma=2592000, h3-Q050=":9003"; ma=2592000, h3-Q049=":9003"; ma=2592000, h3-Q048=":9003"; ma=2592000, h3-Q046=":9003"; ma=2592000, h3-Q043=":9003"; ma=2592000, quic=":9003"; ma=2592000; v="43,46,48,49,50"' always;

        # h3 和 h3-xx 表示不同版本的 HTTP/3（基于 QUIC）。

        # h3-Qxxx/h3-Txxx 是 Google Chrome/QUIC 的实验性草案版本号。

        # quic 表示早期的 Google QUIC 协议，v="43,46" 表示支持的 QUIC 协议版本号列表。
        # v="43,46,48,49,50"：表示支持的 QUIC 协议版本号列表。 例如 v="43,46" 意味着服务器支持 QUIC v43和v46 这2个版本。客户端会根据自身支持情况选择匹配的版本。

        # 标准 HTTP/3 协议标识：h3 表示正式的 HTTP/3 协议（IETF 标准版），基于 QUIC + UDP + TLS 1.3。

        # HTTP/3 草案版本：h3-29、h3-28、h3-27、h3-25 表示 HTTP/3 的不同草案版本（draft 29、28、27、25）。 在 HTTP/3 标准化过程中，浏览器和服务器需要通过 Alt-Svc 广告支持的草案版本，以保证兼容性。

        # Google/Chrome 的实验性版本号：h3-T050、h3-Q050、h3-Q049、h3-Q048、h3-Q046、h3-Q043 这些是 Google Chrome 和 QUIC 实现中的实验性 ALPN 标识符，Qxxx 表示 QUIC 草案版本（例如 Q050 = QUIC draft 50）。Txxx 表示 测试版/实验性分支。 它们主要用于浏览器和 Google 服务器之间的早期实验，确保不同版本的 QUIC/HTTP3 能互通。h3-T050	Chrome/Google QUIC 实验性版本 (Test 50)。

        # quic：表示 Google 的 早期 QUIC 协议（在 IETF 接管之前）。 这是 HTTP/3 的前身，Google 在 Chrome 和自家服务中广泛使用过。
        # v="43,46,48,49,50"：表示支持的 QUIC 协议版本号列表。 例如 v="43,46" 意味着服务器支持 QUIC v43和v46 这2个版本。客户端会根据自身支持情况选择匹配的版本。

        add_header Alt-Svc 'h3=":9003"; ma=2592000' always;



        add_header QUIC-Status $http3 always;

        # 这里可以加一些安全相关响应头（可选）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 启用 QUIC 地址验证（减少伪造 IP 带来的放大攻击风险）
        # 启用QUIC地址验证功能。这包括在重试数据包或NEW_TOKEN帧中发送新令牌，以及验证初始数据包中接收到的令牌。
        quic_retry on;
        # 启用 0-RTT（客户端重连时可以“秒开”，但要自己评估重放风险）
        ssl_early_data on;

        # 启用 GSO 优化（网络接口支持的话），启用基于分段卸载的优化批量模式发送。
        # 优化发送仅在支持UDP_SEGMENT的“Linux系统”上可用。
        # “Linux系统”独有！！！
        quic_gso on;

        http2 on;

        #https://nginx.org/en/docs/http/ngx_http_v2_module.html#http2_body_preread_size
        #设置每个请求在开始处理前保存请求正文的缓冲区大小。
        http2_body_preread_size 10240k;
        #设置连接中并发 HTTP/2 流的最大数量。
        http2_max_concurrent_streams 10240;

        # 启用HTTP/3协议协商。
        http3 on;

        # 设置连接中HTTP/3请求流的最大并发数。
        http3_max_concurrent_streams 10240;
        # 设置用于读写QUIC流的缓冲区大小。
        http3_stream_buffer_size 10240k;
        # 设置 QUIC 传输参数 active_connection_id_limit 的值。该值表示服务器上可存储的客户端连接 ID 最大数量。
        quic_active_connection_id_limit 1024;

        #https://nginx.org/en/docs/http/ngx_http_core_module.html#large_client_header_buffers
        large_client_header_buffers 1024 10240k;
		#https://nginx.org/en/docs/http/ngx_http_core_module.html#keepalive_requests
        keepalive_requests 2024;

        access_log  /home/lp12278/Documents/Nginx/App/logs/http3_quic.access.log  log_http3_quic;

        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_certificate
        ssl_certificate        /home/lp12278/Documents/Nginx/App/html/HTTPSSL001/002服务端CA证书/HTTPSSL001_Servers_CA.crt;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_certificate_key
        ssl_certificate_key    /home/lp12278/Documents/Nginx/App/html/HTTPSSL001/001根CA证书/HTTPSSL001_Root_CA_Key.key;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_ciphers
        ssl_ciphers ALL:!aNULL:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_protocols
        # HTTP/3 必须跑在 TLS 1.3 上，不管端口号是多少，但是 HTTP/1.1、HTTP/2 可以继续支持 1.2。
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        # 启用或禁用通过TLS会话票证实现的会话恢复功能。
        ssl_session_tickets off;
        # 推荐关闭服务端密码套件优先级，让客户端自己协商
        ssl_prefer_server_ciphers  off;
        #https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_buffer_size
        ssl_buffer_size 16k;

        #此外，使用"="修饰符还可以定义 URI 和位置的精确匹配。如果找到精确匹配，搜索就会终止。例如，如果"/"请求频繁出现，定义 "location = /"将加快这些请求的处理速度，因为第一次比较后搜索就会终止。这样的位置显然不能包含嵌套位置。
        location = / {
            root   /home/lp12278/Documents/Nginx/App/html;
            index  index.html index.htm;
        }

        location /simulation_servers_deno {
            proxy_pass https://localhost:9200;
            proxy_headers_hash_bucket_size 1024;
            proxy_headers_hash_max_size 1024;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #正则表达式用前面的"~*"修饰符（不区分大小写匹配）或"~"修饰符（区分大小写匹配）指定。
        location / {
            root   /home/lp12278/Documents/Nginx/App/html;
            index  index.html index.htm;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /home/lp12278/Documents/Nginx/App/html;
        }
    }

}

stream {
    #https://nginx.org/en/docs/ngx_core_module.html#include
    #########被提示：[emerg] "types" directive is not allowed here in D:\Nginx\App/conf/mime.types:2
    #include       mime.types;

    #https://nginx.org/en/docs/stream/ngx_stream_core_module.html#preread_buffer_size
    preread_buffer_size 16k;
    #https://nginx.org/en/docs/stream/ngx_stream_core_module.html#preread_timeout
    preread_timeout 60s;
    #https://nginx.org/en/docs/stream/ngx_stream_core_module.html#proxy_protocol_timeout
    proxy_protocol_timeout 60s;
    #https://nginx.org/en/docs/stream/ngx_stream_core_module.html#resolver_timeout
    resolver_timeout 60s;
    #https://nginx.org/en/docs/stream/ngx_stream_core_module.html#variables_hash_bucket_size
    variables_hash_bucket_size 64;
    #https://nginx.org/en/docs/stream/ngx_stream_core_module.html#variables_hash_max_size
    variables_hash_max_size 1024;

    #https://nginx.org/en/docs/stream/ngx_stream_log_module.html#log_format
    log_format proxy '$remote_addr [$time_local] '
                 '$protocol $status $bytes_sent $bytes_received '
                 '$session_time "$upstream_addr" '
                 '"$upstream_bytes_sent" "$upstream_bytes_received" "$upstream_connect_time"';

    #https://nginx.org/en/docs/http/ngx_http_log_module.html#access_log
    #第二个参数“proxy”是必须先被上面的选项“log_format”定义后，才能使用的。
    access_log  /home/lp12278/Documents/Nginx/App/logs/access.proxy.log  proxy;

    #https://nginx.org/en/docs/stream/ngx_stream_map_module.html#map_hash_bucket_size
    map_hash_bucket_size 128;
    #https://nginx.org/en/docs/stream/ngx_stream_map_module.html#map_hash_max_size
    map_hash_max_size 2048;

    #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_buffer_size
    proxy_buffer_size 16k;
    #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_connect_timeout
    proxy_connect_timeout 60s;
    #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_download_rate
    proxy_download_rate 0;

    upstream http_backend {
        server localhost:9000;
    }

    upstream https_backend {
        server localhost:9200;
    }

    map $ssl_preread_protocol $upstream {
        default http_backend;
        "TLSv1.0" https_backend;
        "TLSv1.1" https_backend;
        "TLSv1.2" https_backend;
        "TLSv1.3" https_backend;
    }

    server {
        #https://nginx.org/en/docs/http/ngx_http_core_module.html#default_type
        #########被提示：[emerg] "default_type" directive is not allowed here
        #default_type  application/octet-stream;

        #https://nginx.org/en/docs/http/ngx_http_core_module.html#sendfile
        #########被提示：[emerg] "sendfile" directive is not allowed here
        #sendfile        on;
        #https://nginx.org/en/docs/http/ngx_http_core_module.html#tcp_nopush
        #tcp_nopush     on;

        #https://nginx.org/en/docs/http/ngx_http_core_module.html#keepalive_timeout
        #keepalive_timeout  0;
        #########被提示：[emerg] "keepalive_timeout" directive is not allowed here
        #keepalive_timeout  300;

        #使用 SSL/TLS 协议时，压缩响应可能会受到 BREACH 攻击。
        #https://nginx.org/en/docs/http/ngx_http_gzip_module.html
        #########被提示：[emerg] "gzip" directive is not allowed here
        #gzip  on;
        #gzip_buffers 16 8k;
        #gzip_comp_level 5;
        #gzip_http_version 1.1;
        #gzip_min_length 20;
        #gzip_proxied off;
        #gzip_types font/woff font/woff2 font/opentype font/ttf application/xml application/javascript application/atom+xml application/json application/manifest+json application/vnd.google-earth.kml+xml application/wasm application/xhtml+xml text/mathml text/plain text/vnd.wap.wml text/x-component text/html text/css text/xml text/javascript text/cache-manifest;
        #gzip_vary on;

        listen   8999;
		listen   [::]:8999;
        ssl_preread on;
        proxy_pass $upstream;
        #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_ssl
        #proxy_ssl on;
        #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_ssl_certificate
        #proxy_ssl_certificate   D://OpenSSL//WorkSpace//HTTPSSL001//002服务端CA证书//HTTPSSL001_Servers_CA.crt;
        #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_ssl_certificate_key
        #proxy_ssl_certificate_key   D://OpenSSL//WorkSpace//HTTPSSL001//001根CA证书//HTTPSSL001_Root_CA_Key.key;
        #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_ssl_protocols
        proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_ssl_trusted_certificate
        #proxy_ssl_trusted_certificate   D://OpenSSL//WorkSpace//HTTPSSL001//001根CA证书//HTTPSSL001_Root_CA.crt;
        #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_ssl_verify
        #proxy_ssl_verify on;
        #https://nginx.org/en/docs/stream/ngx_stream_proxy_module.html#proxy_timeout
        proxy_timeout 10m;

        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_alpn
        ssl_alpn    h2 http/1.1;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_certificate
        ssl_certificate         /home/lp12278/Documents/Nginx/App/html/HTTPSSL001/002服务端CA证书/HTTPSSL001_Servers_CA.crt;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_certificate_key
        ssl_certificate_key     /home/lp12278/Documents/Nginx/App/html/HTTPSSL001/001根CA证书/HTTPSSL001_Root_CA_Key.key;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_ciphers
        ssl_ciphers ALL:!aNULL:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_handshake_timeout
        ssl_handshake_timeout 60s;
        #https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html#ssl_protocols
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_session_timeout  5m;
        ssl_prefer_server_ciphers  on;
    }

}
