[package]
name = "rust-wasm_bindgen-wasm_pack-demo"
version = "1.0.0"
# edition可有值：2015、2018、2021、2024
edition = "2024"

#[lints.rust]
# 要求 Cargo 1.74 或更新版本。表示允许不符合 snake_case 命名规范的标识符，不再针对这条规则产生警告。
#non_snake_case = "allow"

# 优化最终构建产物的体积。
[profile.release]
# s 偏向减小体积，3 偏向运行性能。
# 0	不优化
# 1	基础优化
# 2	较高级优化
# 3	最高常规优化级别
# "s"	以减小体积为目标
# "z"	更积极地减小体积
opt-level = "z"
# 这使得编译后的代码运行更快、体积更小，但会延长编译时间，因此仅在发布模式下启用。
# 启用 LTO（Link Time Optimization）。
# 进行链接时优化，允许跨代码单元进行进一步优化。
# LTO 即 Link Time Optimization，链接时优化。
# 它允许编译器在链接阶段进行跨 Crate 的优化，例如：
# - 跨 Crate 函数内联。
# - 消除不必要的代码。
# - 合并部分重复代码。
# - 进行更深入的全局优化。
# true 使用 Fat LTO，优化力度通常更大，但会增加编译时间。
lto = true
# 将代码生成单元设置为 1。
# 有利于整体优化和代码消除。
# 可以让编译器在更大的代码范围内执行优化，也有助于配合 LTO 使用。
# 代价是编译速度可能下降。
codegen-units = 1
debug = false
# 剥离符号信息，减少最终产物中不需要的符号相关信息。
# 注意，它不会删除你使用 #[unsafe(no_mangle)] 导出的 WebAssembly 函数。
# strip 的可能字符串值为“none”、“debuginfo”和“symbols”。默认值为“none”。
# 您也可以使用布尔值 true 或 false 来配置此选项。strip = true 与 strip = “symbols” 效果相同。
# strip = false 与 strip = “none” 效果相同，并将完全禁用 strip 功能。
# 注意：对于需要经过 wasm-bindgen 和 wasm-pack 处理的 WebAssembly 项目，不建议在 Rust 编译阶段使用 strip = "symbols"。
strip = "none"
split-debuginfo = "off"
# 明确使用 abort panic 策略。
# 发生 panic 时直接终止，不执行栈展开。
# wasm32-unknown-unknown 目前默认采用panic=abort。
# 因此，显式写上它主要是为了明确构建意图，通常不会额外带来明显的体积缩减。
panic = "abort"
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

# wasm-pack Release 配置
[package.metadata.wasm-pack.profile.release]
# wasm-opt 是 Binaryen 工具集中的 WebAssembly 优化器，可以对已经生成的 .wasm 文件执行进一步优化。
# 主要包括：
# - 删除不可达代码。
# - 消除冗余指令。
# - 合并重复代码。
# - 优化控制流。
# - 优化函数调用。
# - 优化代码体积。
# - 删除调试信息及不必要的元数据。
wasm-opt = [
  # "-O0"：不执行优化。
  # "-O1"：执行基础优化。
  # "-O2"：执行较全面的优化。
  # "-O3"：更积极地优化运行性能。
  # "-Os"：优先优化文件体积。
  # "-Oz"：更积极地优化文件体积。
  "-Oz"
]

[lib]
# 库名称，要生成的 .wasm 文件的名称。
name = "rust_wasm_bindgen_wasm_pack_demo"
# Rust 入口文件，Rust源码文件路径。
path = "src/lib.rs"
# cdylib：生成用于外部语言调用的动态库形式产物，是这类 Wasm 库项目的重要配置。
# rlib：保留 Rust 原生库形式，便于其他 Rust 项目使用，也方便编写原生测试。
crate-type = [
  "cdylib",
  "rlib"
]

[dependencies]
# Rust 与 JavaScript 之间的绑定。Rust 端的绑定宏和运行时依赖。
wasm-bindgen = "0.2.130"
# 需要在 Rust 内部等待 JavaScript 的 Promise，还可以使用：
wasm-bindgen-futures = "0.4.80"
# 序列化和反序列化。
serde = {
  version = "1.0.229",
  features = [
    "derive"
  ]
}
# 在 Rust 与 JavaScript 对象之间进行 Serde 转换。
# 它负责通过 Serde 将 Rust 数据结构与 JavaScript 对象互相转换。相比把复杂对象全部手动拆分为简单参数，这种方式更适合实际业务系统。
serde-wasm-bindgen = "0.6.5"
# 将 Rust panic 信息输出到浏览器控制台。
console_error_panic_hook = "0.1.7"
# JavaScript 内置对象和 API 的 Rust 类型封装
js-sys = "0.3.107"
# 浏览器 Web API 的 Rust 类型封装
web-sys = {
  version = "0.3.107",
  features = [
    "Window"
  ]
}
# 浏览器定时器及 Future 支持
gloo-timers = {
  version = "0.4.1",
  features = [
    "futures"
  ]
}
