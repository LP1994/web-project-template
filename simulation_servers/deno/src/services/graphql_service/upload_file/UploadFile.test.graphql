#也支持批量的文件上传操作！！！是跟“singleUpload”、“multipleUpload”不同的操作。

#一次性上传单个文件
mutation singleUpload($file: Upload!) {
  singleUpload: singleUpload(file: $file) {
    #例子：
    #{
    #  fileName: 'test.png',
    #  mimeType: 'image/png',
    #  encoding: 'binary', // '7bit' | '8bit' | 'binary'
    #  size: 102400,
    #  filePath: 'G:/WebStormWS/7788/1.png',
    #}
    fileName,
    mimeType,
    encoding,
    size,
    filePath,
  },
}

#一次性上传多个文件
mutation multipleUpload($files: [Upload!]!) {
  multipleUpload: multipleUpload(files: $files) {
    #例子：
    #{
    #  fileName: 'test.png',
    #  mimeType: 'image/png',
    #  encoding: 'binary', // '7bit' | '8bit' | 'binary'
    #  size: 102400,
    #  filePath: 'G:/WebStormWS/7788/1.png',
    #}
    fileName,
    mimeType,
    encoding,
    size,
    filePath,
  },
}
