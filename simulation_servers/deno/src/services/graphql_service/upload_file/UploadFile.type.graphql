scalar Upload

"上传文件成功后，返回的数据。"
type UploadFileResult {
  "文件上传成功后，返回的数据里会有这个url参数，用于客户端再次从服务端获取其上传的那个文件。"
  url: String!,
}

type Mutation {
  "一次性上传单个文件。"
  singleUpload(file: Upload!): UploadFileResult!,

  "一次性上传多个文件。"
  multipleUpload(files: [Upload!]!): UploadFileResult!,
}
