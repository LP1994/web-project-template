[package]
name = "file_hash_wasm_by_rust"
version = "1.0.0"
# edition可有值：2015、2018、2021、2024
edition = "2024"

[lints.rust]
# 要求 Cargo 1.74 或更新版本。表示允许不符合 snake_case 命名规范的标识符，不再针对这条规则产生警告。
non_snake_case = "allow"

# 优化最终构建产物的体积。
[profile.release]
# s 偏向减小体积，3 偏向运行性能。
# 0	不优化
# 1	基础优化
# 2	较高级优化
# 3	最高常规优化级别
# "s"	以减小体积为目标
# "z"	更积极地减小体积
opt-level = "z"
# 这使得编译后的代码运行更快、体积更小，但会延长编译时间，因此仅在发布模式下启用。
# 启用 LTO（Link Time Optimization）。
# 进行链接时优化，允许跨代码单元进行进一步优化。
# LTO 即 Link Time Optimization，链接时优化。
# 它允许编译器在链接阶段进行跨 Crate 的优化，例如：
# - 跨 Crate 函数内联。
# - 消除不必要的代码。
# - 合并部分重复代码。
# - 进行更深入的全局优化。
# true 使用 Fat LTO，优化力度通常更大，但会增加编译时间。
lto = true
# 将代码生成单元设置为 1。
# 有利于整体优化和代码消除。
# 可以让编译器在更大的代码范围内执行优化，也有助于配合 LTO 使用。
# 代价是编译速度可能下降。
codegen-units = 1
debug = false
# 剥离符号信息，减少最终产物中不需要的符号相关信息。
# 注意，它不会删除你使用 #[unsafe(no_mangle)] 导出的 WebAssembly 函数。
# strip 的可能字符串值为“none”、“debuginfo”和“symbols”。默认值为“none”。
# 您也可以使用布尔值 true 或 false 来配置此选项。strip = true 与 strip = “symbols” 效果相同。
# strip = false 与 strip = “none” 效果相同，并将完全禁用 strip 功能。
# 注意：对于需要经过 wasm-bindgen 和 wasm-pack 处理的 WebAssembly 项目，不建议在 Rust 编译阶段使用 strip = "symbols"。
strip = "none"
split-debuginfo = "off"
# 明确使用 abort panic 策略。
# 发生 panic 时直接终止，不执行栈展开。
# wasm32-unknown-unknown 目前默认采用panic=abort。
# 因此，显式写上它主要是为了明确构建意图，通常不会额外带来明显的体积缩减。
panic = "abort"
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

# wasm-pack Release 配置
[package.metadata.wasm-pack.profile.release]
# wasm-opt 是 Binaryen 工具集中的 WebAssembly 优化器，可以对已经生成的 .wasm 文件执行进一步优化。
# 主要包括：
# - 删除不可达代码。
# - 消除冗余指令。
# - 合并重复代码。
# - 优化控制流。
# - 优化函数调用。
# - 优化代码体积。
# - 删除调试信息及不必要的元数据。
wasm-opt = [
  # "-O0"：不执行优化。
  # "-O1"：执行基础优化。
  # "-O2"：执行较全面的优化。
  # "-O3"：更积极地优化运行性能。
  # "-Os"：优先优化文件体积。
  # "-Oz"：更积极地优化文件体积。
  "-Oz"
]

[lib]
# 库名称，要生成的 .wasm 文件的名称。
name = "FileHashWasmByRust"
# Rust 入口文件，Rust源码文件路径。
path = "FileHashWasmByRust.rs"
# cdylib：生成用于外部语言调用的动态库形式产物，是这类 Wasm 库项目的重要配置。
# rlib：保留 Rust 原生库形式，便于其他 Rust 项目使用，也方便编写原生测试。
crate-type = [
  "cdylib",
  "rlib"
]

[dependencies]
# WebAssembly 和 JavaScript 之间的绑定。
wasm-bindgen = "0.2.130"
# 访问 JavaScript 原生对象、Reflect 等 API。
js-sys = "0.3.107"
# MD5 算法。注意：Cargo 中的包名是 md-5，Rust 中的导入名称是 md5。
md-5 = "0.11.0"
# 哈希算法第1代，SHA-1（别名：SHA1）
sha1 = "0.11.0"
# 哈希算法第2代，SHA-2，包括 SHA-224（别名：SHA224、SHA2-224）、SHA-256（别名：SHA256、SHA2-256）、SHA-384（别名：SHA384、SHA2-384）、SHA-512（别名：SHA512、SHA2-512）
sha2 = "0.11.1"
# 哈希算法第3代，SHA-3，包括 SHA3-224、SHA3-256、SHA3-384、SHA3-512
sha3 = "0.12.0"
# Base64 编码。
base64 = "0.23.1"
# 十六进制编码。
hex = "0.4.3"
